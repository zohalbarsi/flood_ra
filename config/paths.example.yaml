# Data locations on the remote desktop. On the server run once:
#   cp config/paths.example.yaml config/paths.yaml
# then fix anything below that is wrong. config/paths.yaml is gitignored,
# so your edits there never conflict with `git pull`. "~" means your home folder.

# Read-only raw inputs (the pipeline never writes here).
# The infoUSA path was given as /Desktop/project/InfoUSA/rawdata; it is assumed
# to sit under your home folder like the flood folder. Check with `ls`.
infousa_raw: "/home/z/zebarsi/Desktop/project/InfoUSA/rawdata"
flood_exposure: "/home/z/zebarsi/Desktop/RA/flood_exposure"

# Where the pipeline writes its Parquet and merged files. These get large:
# check your quota (`quota -s` or `df -h ~`) and point this at scratch or
# project space if home is small.
derived: "/home/z/zebarsi/Desktop/RA/flood_ra_derived"

# Which files inside infousa_raw step 01 converts (glob, "**/" = any subfolder),
# and their delimiter ("," or "|" or "\t"). Set both from data_inventory.md.
infousa_glob: "**/*.csv"
infousa_delim: ","
