# Project choices. Tracked in git so every result can be traced to the settings that produced it. Machine-specific paths live in config/paths.yaml.

infousa_glob: "**/US_Consumer_5_File_*.csv.gz"
infousa_delim: ","

infousa_encoding: latin-1

# Years with two versions: which one the merge uses 
prefer_version:
  2023: alt
  2024: main

# Keep households whose address state is one of these postal codes.
study_states: [NC, SC]

# Hurricane Florence flood exposure files, relative to flood_exposure.
flood_files:
  tract: florence_census_tract_flood_exposure.csv
  bg: florence_block_group_flood_exposure.csv
  block: florence_census_block_flood_exposure.csv
  block_polygons: florence_census_block_flood_exposure.geojson   # outlines for the block merge

# Which infoUSA columns build the tract / block-group IDs for the merge:
geo_family: als2010
