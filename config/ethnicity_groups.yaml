# Ethnicity_Code_1 (first person) -> race/ethnicity group for step 06.
# Data Axle's codes are mostly ISO country codes of the name's origin, plus
# some coded groups. Built from the code letters and checked against how each
# code's county shares track ACS householder race (output/logs/demographics.md).
# NOT from the Data Axle Ethnicity-Cultural Coding Datacard: replace with the
# datacard's definitions when available. Codes not listed count as "other";
# 00 / blank = missing.
#
# Coded (non-country) groups, by evidence:
#   E5 English, S3 Scottish, W4 Welsh, J4 Jewish (by letter and r_white > 0)
#   B5, LR, Q6-Q9: Black. LR (r_black 0.77) disappears in 2018, when Q6-Q8
#     appear and Q9 triples; together they replace LR almost one for one.
#   H5 Hispanic (r_hispanic 0.95); A7 and K5 Asian (r_asian 0.83; K5 Korean?)
#   N3, P4 and the rare C3, H3, A8, K8, Z8, B3, T5, X5, O8, C5, T4, A4, ZZ: unknown -> other
#   Middle East / North Africa codes go to white, as in the ACS race question.

